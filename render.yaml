services:
  - type: web
    runtime: python
    name: venturebridge-semantic-backend
    region: frankfurt
    plan: free
    branch: codex/flutter-matching-chat-fixes
    rootDir: semantic-backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    buildFilter:
      paths:
        - render.yaml
        - semantic-backend/**
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_EMBED_MODEL
        value: text-embedding-3-large
      - key: MATCH_THRESHOLD
        value: "0.58"
      - key: SEMANTIC_WEIGHT
        value: "0.72"
      - key: INDUSTRY_WEIGHT
        value: "0.12"
      - key: STAGE_WEIGHT
        value: "0.08"
      - key: FUNDING_WEIGHT
        value: "0.08"
      - key: SEMANTIC_FLOOR
        value: "0.60"
      - key: SEMANTIC_CEILING
        value: "0.82"
      - key: INDUSTRY_MISMATCH_PENALTY
        value: "0.10"
      - key: STAGE_MISMATCH_PENALTY
        value: "0.07"
      - key: FUNDING_MISMATCH_PENALTY
        value: "0.07"
